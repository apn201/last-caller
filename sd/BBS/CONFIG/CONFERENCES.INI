; Conferences (message bases). Section number = conference id; 0 is where
; every caller starts and is always open. Edit, then RELOAD as SysOp.
; Keys: name, description, min_security, required_flag, read_only.
; read_only=1: nobody posts here but the SysOp (story areas).
; A conference with a folder /BBS/MSGBASE/<id> on the card also shows that
; folder's read-only message history: the crew's posts of 1998 are there.
; DRAFT descriptions: the author makes the final edit.
