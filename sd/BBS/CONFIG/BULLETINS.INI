; Bulletins, listed with B. mandatory=1 bulletins are shown at every login.
; Keys: title, path (an art file, relative to /BBS) or text (a quick line;
; | starts a new line), min_security, required_flag, mandatory.
; A path ending .ANS has a plain twin under ASCII/ (same name, .ASC) for
; callers without ANSI. DRAFT: the author makes the final edit.
