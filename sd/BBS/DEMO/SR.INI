; Ty's demo (slice GE2): his text-mode Second Reality, the easter egg in Ty's Gallery after the ending
; (2NDREAL.DMO, behind NEEDS.BBS END1|END2). Read by the board (the [T..] steps: Telnet, or a browser without
; SR.JS) and by the browser (/demo/SR.JS reads the whole file as /demo/SR.INI). Reload with RELOAD as SysOp.
; Every word is a DRAFT for the author's final edit. Plain keyboard characters only; | breaks a line.
;
; [DEMO]  tune=     the module in /BBS/DEMO: Second Reality's own MUSIC0.S3M (public domain, see CONTENT_POLICY),
;                   its patterns unscrambled by tools/demo/sr_unscramble.py
;         subsong=  the sequences to play in turn (libopenmpt numbering): 0 is the spaceship intro music
;                   (120 s), 1 the main tune (349 s); a comma list chains them; empty plays the longest
;         fade=     seconds the music fades out before the last part ends
; [P..]   the browser parts: kind (intro, title, dots, plasma, glenz, tunnel, note, scroll), start and end in
;         seconds of the tune, and the words (text: Ty's line at the bottom; lines: | separated).
;         In scroll, a line that starts with * is a heading, one that starts with ( is dim.
; [END]   the last screen, after the tune: any key goes back to the file list.
; [T..]   the ANSI version, as in STORY/DEMO.INI: art (ANSI/DEMO/NAME.ANS), text, color, line_ms, pause.

[DEMO]
tune=MUSIC0.S3M
subsong=1
fade=5

