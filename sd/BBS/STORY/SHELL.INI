; The NOWHERE shell: a fake 1998 Unix-like prompt on the data haven's file
; system. Read each time the door opens. Entering the door needs the flags in
; needs= (the board hides the door from everyone else); empty = everyone.
;
; [SHELL]   host= user= prompt= (the board adds a space after it; {user}
;           {host} {cwd}) unknown= ({cmd}) date= owner= (ls -l defaults)
;           motd= (shown on entry; "|" breaks a line)
;           final_cmd= the one typed command that ends the game; final_has=
;           flags the caller needs (without them it is "command not found");
;           final_set= flags it grants; final_text= what it prints (one line);
;           final_scene= a scene (STORY/SCENES) the door starts after the text
; [/path]   one file or directory. Paths are case-insensitive. text= makes a
;           file ("|" breaks a line), dir=1 makes an empty-looking directory
;           (a directory also exists when a file lives below it). has= hides
;           it from callers without those flags (it is "No such file", never
;           "permission denied"). date= owner= are for ls -l.
; Commands: ls [-la] [path], cat, cd, pwd, whoami, uname, help, exit.
;
; Act 3 (Q9) fills the tree: orders, the client list, the outbound queue, and
; the final command. This is the engine's proof, not the story.
;
; All caller-visible wording is a DRAFT. The author makes the final edit.

[SHELL]
host=nowhere
user=guest
prompt={user}@{host}:{cwd}$
needs=NOWHERE_OPEN
motd=NOWHERE data haven. Your data is NOWHERE.|Unauthorised use is logged. Authorised use is logged.
unknown={cmd}: command not found
date=Oct 31  1998
owner=root
; Draft final command (Q6): releases the outbound queue once the manifest is whole.
; Q9 writes the real command and the puzzles that lead to it. The ending itself is the
; scene STORY/SCENES/ENDING.INI (final_scene=).
final_cmd=release outbound
final_has=M_Z
final_text=outbound: 1 job, 41 messages, 3 files. Released.
final_scene=ENDING

[/README]
text=NOWHERE. Off-site storage for clients who prefer not to be found.|Files are kept as long as the fee is paid.

[/etc/motd]
text=Your data is NOWHERE.

[/etc/hosts]
text=127.0.0.1   localhost|10.0.0.7    halcyon-486|10.0.0.9    nowhere
date=Jul 14  1998

[/var/log/outbound]
text=No jobs queued.
date=Dec  8  1998
