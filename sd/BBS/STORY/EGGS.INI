; Easter eggs (src/bbs/eggs.h, src/doors/snake.h). Read each time one is used.
; Nothing here is needed to finish the game and nothing here sets a flag.
; A card without this file understands OK and NO CARRIER and nothing else.
; "|" starts a new line. All caller-visible wording is a DRAFT. The author
; makes the final edit.

; What the board's modem says. ATI0 to ATI9 print id0 to id9 (a missing one is ERROR).
[MODEM]
ok=OK
error=ERROR
nocarrier=NO CARRIER
busy=BUSY
noanswer=NO ANSWER
nodialtone=NO DIALTONE
connect=CONNECT 2400
id0=28800
id1=ROM checksum 0x1F4A|ROM test passed
id2=OK
id3=Norlink NL-288 V.34 ROM 1.04
id4=Norlink NL-288 data/fax, 2 serial ports: one is not used
id5=Line status: no line
id7=Norlink NL-288, made for a clean room

; A number you can dial. Any section named NODE_something. number= is compared
; by its digits. art= is ANSI/DOORS/<ART>.ANS (ASCII/DOORS/<ART>.ASC).
[NODE_LUMEN]
number=5550172
art=NODE_LUMEN
text=caller #4,117. last caller: skit, 11 min ago.|the board is closed 02:00 to 04:00 for the nightly.|the sysop is out. leave a message after the beep.|if you are tyv: your slot is saved.|the one note guy has been told.||(beep)

; Typed at the main menu. They are in no menu and no help text.
[HIDDEN]
xyzzy=Nothing happens.|Somewhere a lamp is lit, and nobody is reading by it.

; FORTUNE or /FORTUNE: one of these, at random. None says anything about the crew.
[FORTUNES]
f01=The coffee is a mission constraint.
f02=A backup nobody has restored is a rumour.
f03=If it blinks, it is working. If it does not blink, ask what it is doing instead.
f04=Low orbit is 92 minutes from sunrise to sunrise. Sleep in shifts.
f05=Thermostat law: whoever is cold is right.
f06=Read the manual. Then read the page the manual says is intentionally blank.
f07=A modem that never dials never gets a busy signal.
f08=The sun is up somewhere. Plan the laundry accordingly.
f09=Do not feed the packet gateway after midnight. It does not eat. It just remembers.
f10=You have mail. The ground says hello at the top of the hour.
f11=A 486 does not get tired. It gets warm.
f12=Every system is nominal until somebody asks exactly.
f13=Tape holds most things. Do not test it on a switch you need.
f14=Ten megabytes of text is a lot of text. Nobody in orbit has read all of it.
f15=The shortest route between two decks is the one without a hatch.
f16=Meal rota, week 1: the third Thursday is a Tuesday.

; Ty's snake (doors/snake.h). hi1 to hi9: NAME;SCORE;DATE. Nothing the caller scores is saved.
[SNAKE]
intro=Ty wrote this in two nights. W A S D to turn, several at once if you like.|Walls, the rack and the bulkhead end the game. So does yourself.
table=HIGH SCORES
hi1=TYVANCE;41;1998-11-12
hi2=CMDR;29;1998-11-15
hi3=GARDEN;17;1998-11-09
hi4=CHAOS;3;1998-11-14
