; The story's accounts. Made by the board at start-up if they are missing
; (bbs/accounts.h); an existing account is never changed. Crew accounts are
; read-only: many callers may use one at once, and nothing a visitor does
; changes it. Callers who sign in to one carry what they find to their own
; account (STORY/TRIGGERS.INI).
;
;   name=      real name              location=  shown in the user list
;   password=  empty = nobody can log in as this account
;   level=     security level (default 20)
;   flags=     access flags of the account; READONLY, and VISIT_<X> opens the
;              mail of that crew member for whoever has visited them
;   calls=     calls shown in the user list
;   last=      the last call, "YYYY-MM-DD HH:MM", on the board's 1998 clock
;   sync=1     an existing account is brought in line (password, level, flags)
;   learned_by= story lint only: the flag a caller holds once the password can be found
;
; Last calls follow the timeline: the ground relay stops at 14:08 on the 22nd,
; the minute before the downlink was disabled (14:09).
;
; DRAFT. Passwords: TYVANCE is his birthday as day, month, year (140374);
; CHAOS is LADDER; CMDR is ANDERS; GARDEN is HANAMI. Act 1 hints TYVANCE; act 2
; hints the others (Orbit 3 at slow speed, Orbit 5 and 6, the Lounge post Locks,
; the Garden Notes of 24 Nov). TY_HOME opens Ty's Desktop file area for his
; own account only (a visitor does not carry it). The author makes the final edit of every caller-visible line.

; ELIZA (Q12d, milestone M7): her password is item 14 of the go-live checklist in
; Engineering (SYSOP view). A story account like the others: read-only, below the
; SysOp, never the SYSOP flag. ELZ_HOME opens her own area for her own login; the
; visit gives the caller VISIT_ELIZA (her mail) and ELZ_IN. sync=1 brings an older
; card's account (no password, level 200) in line. CMDR_HOME: the Commander's desk,
; the operations handbook (M6, the cure), for her own login only.
