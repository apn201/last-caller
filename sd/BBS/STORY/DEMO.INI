; The end demo (slice GE). Releasing the queue (SEND or STAY in the ENDING scene) starts it.
; Read by the board (the [T..] steps and [AFTER]) and by the browser (sd/BBS/DEMO/DEMO.JS reads the
; whole file from /demo/DEMO.INI). Edit the words here; no firmware is involved. Reload with RELOAD as SysOp.
; Every word is a DRAFT for the author's final edit. Plain keyboard characters only. | breaks a line.
;
; [DEMO]   scene=      the scene whose ending starts the demo
;          tune=       the module in /BBS/DEMO
;          lost=       the second NO CARRIER line; no_carrier= the first
; [P..]    the browser parts, in order: kind (release, title, letter, news, radio, credits), start and end in
;          seconds of the tune (a pattern is 7.68 s, so a part cut on a multiple of it falls on the beat),
;          and the words. head_END2, sub_END2, text_END2 replace the word when the caller stayed (END2).
; [T..]    the ANSI version (Telnet, or a browser without DEMO.JS): art (ANSI/DEMO/NAME.ANS), text, color (SGR),
;          line_ms (a pause between lines), pause (ms after the step), bar (a progress bar over pause ms),
;          when (END1 or END2: only for that ending).
; [AFTER]  the reconnect screen, then the main menu.

