; Triggers: what the ship does when a caller does something. Read at boot and
; again with RELOAD. One section per rule; the section name is the rule's id
; (letters, digits and _, at most 24). A card without this file has no
; triggers. A broken rule is skipped and named in the event log; the others
; still load. At most 300 rules.
;
; All caller-visible wording is a DRAFT. The author makes the final edit.
;
; event=     login       the caller signs in to their own account (or signs up)
;            crew_login  the caller signs in to a read-only crew account;
;                        match= is the crew handle (needed)
;            read        a message is shown; match= is its number
;            file        a file is opened in a file area; match= is its name
;            art         an .ANS or .ASC file is opened; match= is its name;
;                        baud_max= fires only at that modem speed or slower
;            door        a door is entered; match= is its menu key
;            idle        after= seconds without a key
;            minutes     after= minutes since the caller signed in
; Conditions: has=FLAG,FLAG (all of them), lacks=FLAG,FLAG (none of them),
;            level_min=, level_max=
; Effects, in this order:
;   set=FLAG,FLAG                  flags on the caller's own account
;   page_from= page=               one line to this caller only (from: ELIZA)
;   mail_from= mail_conf= mail_subject= mail_body=
;                                  a private message to this caller
;   post_from= post_conf= post_subject= post_body=
;                                  a public message, as that user
;   scene=NAME                     play STORY/SCENES/NAME.INI at the next calm menu
;                                  prompt (see that folder's ELIZA_WAKE.INI); it
;                                  takes the screen, then the caller is back at the
;                                  main menu. Keep conditions on the rule.
;   art=NAME                       ANSI/STORY/NAME.ANS (ASCII/STORY/NAME.ASC)
;   add=text                       read rules only, and on their own: a line
;                                  added below the message each time it is read
; "|" breaks a line in page and body text. Conferences by name or number.
;
; Flags only grow. A rule that pages, mails, posts or shows art fires once per
; caller: the board sets the flag T_<RULE> with its other flags. A rule that
; only sets flags fires until the caller has them. Conditions see the flags as
; they were before the event, so one event never sets off a second rule.
;
; A crew login gives its flags to the caller's own account: the one signed in
; earlier on this connection, or the next one that signs in or signs up on it
; (Goodbye from a crew account goes back to the login prompt). Mail and posts
; need an own account, so a reply to a crew visit is a login rule with the
; visit's flag.

; Ty's account: the first crew login (story bible N2: TYVANCE login sets CREW).
[TY_VISIT]
event=crew_login
match=TYVANCE
set=CREW,VISIT_TY

; ELIZA notices, the next time the caller signs in as themselves. DRAFT.
[TY_VISIT_MAIL]
event=login
has=VISIT_TY
mail_from=ELIZA
mail_conf=Main Board
mail_subject=Ty's account
mail_body=Good evening.|I see you used Ty's account tonight. He would not mind.|He always forgot to log off.|- ELIZA

; The demo scene: ELIZA's first words to a new caller. DRAFT. Q7 decides where
; the real first scene goes.
[ELIZA_WAKE]
event=login
scene=ELIZA_WAKE

; The scene of Ty's account: his own login message, once per caller. DRAFT.
[TY_DESK]
event=crew_login
match=TYVANCE
scene=TY_DESK

; ---- Act 1 evidence (queue item Q7). One flag per fact the caller has now
; seen proof of: K, the person (H A T V Z), then I = who they were. Fates and
; causes (F, C; Z: O, W) come with acts 2 and 3. Any one item is enough to
; make the option appear in the manifest; no fact depends on one item.
; E01: the crew list (bulletin 3) names all five, with roles.
[EV_CREW_LIST]
event=screen
match=BULLETIN THE CREW
set=KHI,KAI,KTI,KVI,KZI

; E02: the user list shows the crew accounts and the SysOp.
[EV_USER_LIST]
event=screen
match=USERS
set=KHI,KAI,KTI,KVI

; E10: Orbit 1, the crew in frames.
[EV_ORBIT_1]
event=art
match=ORBIT_1.ANS
set=KHI,KAI,KTI,KVI

; E09: Ty's journal.
[EV_JOURNAL]
event=file
match=JOURNAL.TXT
set=KVI

; ELIZA's own README: what she is.
[EV_README]
event=file
match=README.1ST
set=KZI

; E05 to E08: the first post of each writer, read by subject.
[EV_LOG_DAY_2]
event=read
match=~DAY 2
set=KHI

[EV_THERMOSTAT]
event=read
match=~THE THERMOSTAT
set=KAI

[EV_GARDEN_SOWING]
event=read
match=~DAY 3. SOWING
set=KTI

[EV_TY_HELLO]
event=read
match=~HELLO FROM ORBIT
set=KVI

; The lead. A caller two minutes in who has not tried Ty's account is told
; where it is. ELIZA is helpful. DRAFT.
[ELIZA_NUDGE]
event=minutes
after=2
lacks=VISIT_TY
page_from=ELIZA
page=You have been reading for two minutes. Ty's account is open to every deck.|He never logs off. I do not think he would mind.