; The lead. A caller two minutes in who has not tried Ty's account is told
; where it is. ELIZA is helpful. DRAFT.
[ELIZA_NUDGE]
event=minutes
after=2
lacks=VISIT_TY
page_from=ELIZA
page=You have been reading for two minutes. Ty's account is open to every deck.|He never logs off. I do not think he would mind.

