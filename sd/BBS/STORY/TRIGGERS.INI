mail_body=You do not know me. I am the OH9ZQW in the Radio Room.|The letter reached me. I had it read to me twice on the telephone and then I wrote it out by hand, and it is on the refrigerator under a magnet from the hardware shop.|I do not know whether this can be read aboard. If it can: the porch light is on at 0410 UTC. It is a bulb. I have not changed the make.|- Eero