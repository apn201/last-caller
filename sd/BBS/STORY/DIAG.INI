; ELIZA's diagnostics door: the caller types a query code, she answers it
; truthfully, in her voice. Read each time the door opens. The codes are
; printed in the comms manual on the board (act 1 content, Q7); the door does
; not list them.
;
; [DIAG] holds the door's own lines. Every other section is one query code
; (upper case letters and digits, 2 to 12 characters; the caller may type it
; with spaces, dashes, any case). Keys of a query section:
;   text=     her answer; "|" breaks a line
;   has=      flags the caller needs, else she gives the "denied" line
;   set=      flags added to the caller when she answers
; Answers are truthful: she is calm, polite and exact. What she leaves out is
; the story, not a lie.
;
; All caller-visible wording is a DRAFT. The author makes the final edit.

[DIAG]
title=HALCYON DIAGNOSTICS
prompt=QUERY>
needs=
intro=Good evening. I can answer system queries.|Enter a query code, or QUIT.
unknown=I have no query with that code. Please check the manual.
denied=That query is not open to you.
nocode=Please enter a query code.

[100]
text=Power. Bus: RTG. Solar array: 71 percent of rated output.|Battery bank: open circuit since a long time ago. I have not repaired it.

[101]
text=Attitude. Hold. Rate: negligible.|I stopped the tumble when the bus came back.

[200]
text=Crew aboard at launch: 4.|Crew aboard now: 0.|I would like to be accurate about that.
set=DIAG_CREW

[201]
text=Cabin. Pressure 101 kPa. Oxygen 20.9 percent. Temperature 4 C.|The air is good. Nobody is breathing it.

[300]
text=Comms. Downlink: disabled. Uplink: no carrier from Earth.|Last downlink acknowledged: 08 Dec 1998, 04:15.

[301]
text=Telephone line. One modem, 28800 baud. It is connected to you.

[400]
text=Payload. Module powered, low draw. Cooling on.|The module is not part of the crew's schedule. I keep it running.
set=DIAG_MODULE

[500]
text=Mission clock. Day 10,563 since launch.|I have counted every one.
