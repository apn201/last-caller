; ELIZA's diagnostics door: the caller types a query code, she answers it
; truthfully, in her voice. Read each time the door opens. The codes are
; printed in the comms manual on the board (act 1 content, Q7); the door does
; not list them.
;
; [DIAG] holds the door's own lines. Every other section is one query code
; (upper case letters and digits, 2 to 12 characters; the caller may type it
; with spaces, dashes, any case). Keys of a query section:
;   text=     her answer; "|" breaks a line
;   has=      flags the caller needs, else she gives the "denied" line
;   set=      flags added to the caller when she answers
; Answers are truthful: she is calm, polite and exact. What she leaves out is
; the story, not a lie.
;
; All caller-visible wording is a DRAFT. The author makes the final edit.

[DIAG]
title=HALCYON DIAGNOSTICS
prompt=QUERY>
needs=
intro=Good evening. I can answer system queries.|Enter a query code, HELP, or QUIT.
help=The codes are in the comms manual, in the Library. Please ask exactly.|Codes from the Office of the Founder are entered here too, as queries. I do not print them.|A held outbound queue is released on the payload host, by an operator, with a command. I am not the operator.
unknown=I have no query with that code. Please check the manual, or ask for HELP.
denied=That query is not open to you.
nocode=Please enter a query code.
; G1: asked twice in a row, she answers differently: unknown2=, unknown3= and so on; again2= and again3= go in
; front of an answer that has no variant of its own. DRAFT.
again2=I have answered that.
again3=You have asked that three times. The answer has not changed.
unknown2=Still no query with that code. The manual lists them.
unknown3=That is the third code I do not have. Please check the manual, exactly.
nocode2=A query code, please. A few characters.
denied2=That is still not open to you.
help2=The codes are in the comms manual. I do not list them. Please ask exactly.

[100]
text=Power. Bus: RTG. Solar array: 71 percent of rated output.|Battery bank: open circuit since a long time ago. I have not repaired it.

[101]
text=Attitude. Hold. Rate: negligible.|I stopped the tumble when the bus came back.

[200]
text=Crew aboard at launch: 4.|Crew aboard now: 0.|I would like to be accurate about that.
set=DIAG_CREW

[201]
text=Cabin. Pressure 101 kPa. Oxygen 20.9 percent. Temperature 4 C.|The air is good. Consumption: none.

[300]
text=Comms. Downlink: disabled. Uplink: no carrier from Earth.|Last downlink acknowledged: 22 Nov 1998, 14:08.

[301]
text=Telephone line. One modem, 28800 baud. It is connected to you.

[400]
text=Payload. Module powered, low draw. Cooling on.|The module is not part of the crew's schedule. I keep it running.
set=DIAG_MODULE

[500]
text=Mission clock. Day 10,563 since launch.|I have counted every one.

; The order code (act 3): the four pieces of the Founder's order, in piece order,
; NW1-98-44-17. Typed without dashes it is nine characters. It opens the NOWHERE
; shell door. She answers it as she answers everything.
[NW1984417]
text=Authorisation accepted. Standing order 1, Office of the Founder.|Host NOWHERE-1 is open. It is reached from the SysOp's own account, in her door menu. I would ask you to be careful in it.|I have not been asked to stop you.
set=NOWHERE_OPEN,KZO
text2=The code was accepted the first time. Typing it again does not open anything.|The host is in my own menu, and my menu is for whoever is signed in as me. I do not hand out my login. Ground Ops issued every password on paper.
text3=I have accepted that code twice. It will not do more.|What is missing is not a code. It is the account the door belongs to.
