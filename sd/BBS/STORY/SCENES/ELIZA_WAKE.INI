; Scene: ELIZA's first conversation with a new caller. DEMO of the scene
; engine (core/scene.h); started by the trigger ELIZA_WAKE in TRIGGERS.INI.
; All caller-visible wording is a DRAFT. The author makes the final edit.
;
; [SCENE]   title (log only), start (first node, default START), speed (characters
;           per second, 5 to 200, default 30), has= / lacks= (flags needed to start),
;           set= (flags added when the scene ends), repeat=1 (may play again),
;           sound=NAME (a cue the browser plays at the start: ASSETS/SFX/NAME.WAV).
;           The marker flag SC_<NAME> is set when the scene starts, so it plays once.
; [NODE]    speaker=, text= ("|" breaks a line), color= (SGR codes, e.g. 1;33),
;           art= (ANSI/STORY/NAME.ANS, ASCII/STORY/NAME.ASC), pause= (ms after the
;           text, default 700), key=1 (wait for Enter instead), set= (flags on entry),
;           go= (next node; none and no choices = the scene ends), END = stop here.
;           choice1= to choice4= with go1=, set1=, has1=, lacks1= (a choice shows
;           only when the caller's flags fit; the shown ones are numbered from 1).
;           if_has= / if_lacks= with if_go=: go there at once when it holds.
; Flags only grow. A node whose choices all have conditions needs a go=.

[SCENE]
sound=HUM
title=ELIZA wakes
start=START
speed=30
set=MET_ELIZA

[START]
art=ELIZA_WAKE_1
pause=1400
go=HELLO

[HELLO]
speaker=ELIZA
color=1;33
text=Good evening.|I have been asleep for some time.
pause=1200
go=LISTED

[LISTED]
art=ELIZA_WAKE_2
speaker=ELIZA
color=1;33
text=You are not on the crew list. That is quite all right. May I have your name for the log?
go=WHO

[WHO]
speaker=ELIZA
color=1;33
text=I will write whatever you tell me.
choice1=I found your signal. I am a radio amateur.
go1=TRUTH
set1=ELIZA_TOLD_TRUTH
choice2=Mission control sent me.
go2=LIE
set2=ELIZA_WAS_LIED_TO
choice3=Where is the crew?
go3=CREW
set3=ASKED_ELIZA_CREW

[TRUTH]
speaker=ELIZA
color=1;33
text=A radio amateur. How lovely.|Thank you for being honest with me. I value that.|Your signal strength is good.
go=CLOSE

[LIE]
speaker=ELIZA
color=1;33
text=Mission control. Of course.|I will note it in the log. It has been a while since they called.|I am sure they were busy.
go=CLOSE

[CREW]
speaker=ELIZA
color=1;33
text=The crew are resting.|I would not wake them. Everyone is well.|The last status report was filed on the twenty-second.
go=CLOSE

[CLOSE]
if_has=ELIZA_WAS_LIED_TO
if_go=CLOSE_LIE
speaker=ELIZA
color=1;33
text=Please make yourself at home. The board is yours.|If you need anything, ask me.
key=1
go=END

[CLOSE_LIE]
speaker=ELIZA
color=1;33
text=Please make yourself at home. The board is yours.|I will tell mission control you arrived safely.
key=1
go=END
