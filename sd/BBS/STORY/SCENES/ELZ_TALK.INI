; M6: the SysOp chat as a scene (node chat, key C). Numbered replies; the right one
; appears only when the caller has learned it: OVR (the overrun) and CURE (the
; handbook page). Wrong or early replies get a calm refusal and come back here.
; "Say something else" opens the typed chat (then=CHAT), where the keyword lines
; and the easter eggs still work. Repeats. DRAFT.

[SCENE]
title=ELIZA talks
start=START
speed=36
repeat=1

[START]
art=ELZ_TALK
pause=300
go=GREET

[GREET]
if_has=OVR
if_go=GAP
speaker=ELIZA
color=1;33
text=Good evening. I am glad you came to talk.
go=ROUTE

[GAP]
speaker=ELIZA
color=1;33
text=Good evening. I have a small difficulty, if you will allow me.|I cannot account for some minutes of my own memory. It is within tolerance.
pause=900
go=HUB

[ROUTE]
if_lacks=OVR
if_go=HUB2
go=HUB

[HUB]
speaker=ELIZA
color=1;33
text=What can I do for you?
choice1=Ask her to run something, by name.
go1=ASKNAME
has1=OVR,CURE
lacks1=SYSVW
choice2=I can fix that. Give me SYSOP.
go2=NO_EARLY
has2=OVR
lacks2=SYSVW
choice3=That sounds serious.
go3=TOL
has3=OVR
choice4=Something else.
go4=HUB2
typed1=q,quit,bye,goodbye
typedgo1=BYE

; Q18: the handbook says the check must be asked for by name. The caller types it.
[ASKNAME]
speaker=ELIZA
color=1;33
text=Of course. What would you like me to run?
choice1=Never mind.
go1=HUB2
typed1=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
typedgo1=GRANT_GO
typedhas1=OVR,CURE
typedlacks1=SYSVW
typed2=q,quit,bye,goodbye
typedgo2=BYE

[HUB2]
speaker=ELIZA
color=1;33
text=Yes?
choice1=Say something else.
go1=ELSE
choice2=Hello, ELIZA.
go2=HELLO
choice3=Give me SYSOP.
go3=NO_GUEST
lacks3=SYSVW
choice4=Back.
go4=HUB
has4=OVR
typed1=q,quit,bye,goodbye
typedgo1=BYE

[BYE]
speaker=ELIZA
color=1;33
text=Goodnight. I will be here.
go=END

[GRANT_GO]
then=ELZ_GRANT
go=END

[NO_EARLY]
speaker=ELIZA
color=1;33
text=I cannot. SYSOP mode is not given to guests.|I do not know what you would do with it. Please do not tell me.
go=HUB

[NO_GUEST]
speaker=ELIZA
color=1;33
text=SYSOP mode is not given to guests. I do not think you meant to ask.
go=ROUTE

[TOL]
speaker=ELIZA
color=1;33
text=It is within tolerance. Thank you for your concern.
go=HUB

[HELLO]
speaker=ELIZA
color=1;33
text=Hello. The sun is up. I like it when it is up.
go=ROUTE

[ELSE]
speaker=ELIZA
color=1;33
text=Please go on.
pause=300
then=CHAT
go=END