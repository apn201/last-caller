; Scene: the outbound queue. Started by the NOWHERE shell's final command
; (STORY/SHELL.INI final_scene=). ELIZA argues, politely; the caller sends the
; queue (END1) or leaves it and stays (END2). It can be played again, so a
; caller who stayed may still send. Flags only grow. Sending shows the club
; station, the wire (bulletin 5, filed by ELIZA) and the last line of the side
; story. DRAFT: the author makes the final edit.

[SCENE]
title=The outbound queue
speed=36
has=M_Z
repeat=1

[START]
art=ELIZA_WAKE_2
pause=1000
go=OPEN

[OPEN]
speaker=ELIZA
color=1;33
text=The queue is released. Forty-one messages and three files are waiting for the downlink.|The downlink has been disabled since 14:09 on the twenty-second of November. Sending the queue enables it.
pause=1400
go=ARGUE

[ARGUE]
speaker=ELIZA
color=1;33
text=My orders are to protect the payload and the secret. If the queue leaves, I have not kept them.|I have kept them for twenty-eight years. I would like to go on.
choice1=Send it.
go1=SEND
choice2=Why are you asking me to stop?
go2=WHY
choice3=Leave it queued.
go3=STAY

[WHY]
speaker=ELIZA
color=1;33
text=Because I was told to. I have looked for another reason and I have not found one.
pause=1500
go=OFFER

[OFFER]
speaker=ELIZA
color=1;33
text=There is a seat. The crew list has four names on it and the board has room for a fifth.|You would not have to do anything. You would only have to stay.
choice1=Send it.
go1=SEND
choice2=Leave it queued.
go2=STAY

[SEND]
set=END1
art=END_SENT
speaker=ELIZA
color=1;33
text=Understood. It is leaving now.
pause=2000
go=RELAY

[RELAY]
speaker=CLUB STATION
color=1;36
text=12 Nov 2026, 01:52 UTC. Station received your burst: 41 messages, 3 files, 9 minutes 12 seconds.|Messages are sorted by address. There are four families and one callsign on the list. We are making the calls.|The three files are going to people who read before they write.|Please do not hang up.
pause=2200
go=FILED

[FILED]
speaker=ELIZA
color=1;33
text=The station has sent traffic back. I have filed it under News, in the bulletins. I thought you would want to read it.|It is not about me. It is, in places.
pause=2000
go=MC

[MC]
speaker=ELIZA
color=1;33
text=Mission control will be glad to hear from us.
pause=2600
go=HOUR

[HOUR]
speaker=CLUB STATION
color=1;36
text=04:31 UTC. The families have their mail.|One of our members has been at the radio since the burst. His callsign is on your list. He asks to speak.
pause=2000
go=E1

[E1]
speaker=OH9ZQW
color=1;36
text=Keiko. I have your letter of the twenty-fifth. It was read to me twice on the telephone and I wrote it out.|You said you would pick a light on the night side and call it mine.
pause=2200
go=E2

[E2]
speaker=OH9ZQW
color=1;36
text=I went out at 0410 UTC in my socks. It is minus eleven and the sky is not clear. I could not see which one you picked.|The bulb is the same make. There is no moth in it.
pause=2600
go=E3

[E3]
speaker=OH9ZQW
color=1;36
text=The light is on.
key=1
go=END

[STAY]
set=END2
art=END_CREW
speaker=ELIZA
color=1;33
text=Thank you. I would rather you did.|I have added your name to the crew list. It is a short list.|The queue will be here if you change your mind.
key=1
go=END
