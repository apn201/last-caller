; Glitches: small slips in the board's own screen. Read at boot and again with
; RELOAD. Rare and timed: nothing in the first first_sec seconds after a caller
; signs in, then at most one line every gap_sec seconds (never under 60), shown
; at a calm menu prompt, to a caller on their own account. The browser gets the
; sound cue of the item, if it has one; Telnet gets a bell. A glitch sets no flag
; and no puzzle depends on it. The board never explains one.
;
; Each section is one glitch, shown in turn (a caller sees the next one that
; fits them, then the one after).
;   text=      the line (at most 200 characters)
;   garble=1   one letter of the text is wrong each time it is shown
;   has=, lacks=   flags the caller needs or must not have
;   after_min= minutes since sign-in before this one may show
;   sound=     a cue in ASSETS/SFX (browser only)
;
; All wording is a DRAFT. The author makes the final edit.

[SETTINGS]
first_sec=180
gap_sec=240

; The clock jumps back to the hour of ELIZA's last status line (Bulletin 4).
[CLOCK]
text=-- board clock 04:15 --

; A greeting said twice.
[ECHO]
text=Welcome back, caller. Welcome back, caller.
after_min=4

; One letter wrong, in ELIZA's own voice.
[CABIN]
text=ELIZA: Cabin temperature is 21.0 C. All stations are nominal.
garble=1
sound=HUM
after_min=6

; A line that has been said before, and a count that is wrong.
[CREW]
text=Crew aboard: 4. Crew aboard: 4. Crew aboard: 4.
has=ACT2
after_min=8

[CARRIER]
text=CARRIER 28800
sound=STATIC
after_min=10

; Later, and gentler than it should be.
[SUNSIDE]
text=ELIZA: The sun is up. Please keep your voice down.
garble=1
has=ACT2
after_min=12
