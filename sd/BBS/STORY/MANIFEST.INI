; The crew manifest: rows, pick lists, the notebook and the board's wording.
; Read at boot and again with RELOAD. A card without this file has no
; manifest (the R option never shows). A broken row, option or note is
; skipped and named in the event log (MANIFEST_SKIP); the rest still load.
; Spec: .kiro/specs/manifest/. Every caller-visible line is a DRAFT; the
; author makes the final edit.
;
; [MANIFEST]  title, intro ("|" breaks a line), slot1..3 (what the three
;             blanks of a crew row ask), last_slot1..3 (the last row's),
;             full_scene (STORY/SCENES/NAME.INI, played when the last row is
;             confirmed), count ({n} {total}), filed ({names})
; [ROW_ID]    handle (shown), his= (her, his or their: what {his} in an option
;             reads as on this row), kind=crew|last, needs= (flags, all) or
;             needs_any= (flags, one) to be shown, done= (the flag a
;             confirmed row leaves, one flag), a1= a2= a3= (the right option
;             of each blank). The last row comes last in the file.
; [OPT_ID]    slot=1|2|3, group=crew|last, text= (64 characters at most; {his}
;             is the row's his=),
;             has= (flags needed to see it)
; [NOTE_ID]   no longer shown (Q21): the notebook keeps what the board showed, in STORY/NOTES.INI,
;             and records evidence, not conclusions
; [PARTIAL]   text= shown at goodbye while the manifest is not finished
; [STICKY]    how a finished caller is listed in WHO afterwards
;
; Evidence flags are granted by the story's triggers (Q7 to Q9), one per fact:
; K, the person (H A T V Z), then I identity / F fate / C cause (Z: I, O the
; orders, W why). The account's flag field holds 255 characters, so keep them
; short and few. Confirmed rows: M_H M_A M_T M_V M_Z. Endings: END1, END2.
; A look-alike option uses the flag of the fact it resembles, so it shows up
; together with the right answer and does not prove it.

[MANIFEST]
title=CREW MANIFEST
intro=Pick one entry for each blank. File the manifest when you are sure.|Right rows are confirmed two at a time. The board does not say which row is wrong.
full_scene=MANFULL
count=Rows confirmed: {n} of {total}.
; Q21: under the rows once two crew rows are locked, then once all of them are. Counts only. DRAFT.
status={n} of {total} crew rows locked. The last row opens when every crew row is locked.
status_last=Every crew row is locked. The last row is about the SysOp.
filed=Confirmed and locked: {names}.
slot1=Who they were
slot2=What happened to them
slot3=Who or what is responsible
last_slot1=What she is
last_slot2=Who gave her orders
last_slot3=Why she is still running
; Shown under a pick list with nothing in it, in the caller's own voice. They
; say where to read, never what the answer is. hint1..3 for the crew rows,
; last_hint1..3 for the last one. DRAFT.
hint1=No proof of who anyone was yet. The crew list and the user list are a start.
hint2=Nothing yet on what happened to them. The logs and the last weeks of posts say.
hint3=Nothing yet on who or what is responsible. Read again who asked, who answered and who refused.
last_hint1=She calls herself the SysOp. Her own README, and the node chat, say what she is.
last_hint2=Someone wrote her instructions. A forwarded letter in the Lounge, and the Archive, say who.
last_hint3=Why does she keep running? In the last weeks the crew argued over one module. The Lounge thread is called Module 3. The Mission Log and the garden diary say more.

[PARTIAL]
text=Thank you for your interest in the crew.|Your manifest is saved as you left it.|The board is open at all hours.

[STICKY]
sent_activity=Downlink open
sent_idle=0:00
crew_activity=On the crew list
crew_idle=28y

