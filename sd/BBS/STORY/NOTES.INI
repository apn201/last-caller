; The notebook (Q21). One section per note: a short line the board has shown the caller. The
; moment the thing is on screen the note is saved as the flag N_<ID> on the caller's own
; account (a crew login hands it to the own account, as other flags go), once. The notebook
; lists what the caller holds in the order the flags were saved. A note keeps what was seen.
; It never adds an answer, and it never says what a clue means. Read at boot and again with
; RELOAD; a broken note is skipped and named in the event log (NOTE_SKIP).
;
; The section name is the id (letters, digits and _, at most 14; the flag is N_<ID>).
;   on=      what shows it, and what match= names:
;            read       a message is shown. match=~SUBJECT (upper case, as TRIGGERS.INI) or the
;                       message number; area=N keeps a subject that repeats to one conference
;            file       a file is opened: match=NAME.EXT
;            art        a picture file is opened: match=NAME.ANS; baud_max= only at that speed or slower
;            screen     match=USERS, WHO or BULLETIN <TITLE>
;            scene      match=NAME when the scene starts, NAME/NODE when that node is shown
;            page       match=RULE: the page (or picture) a trigger rule sends (TRIGGERS.INI)
;            eliza      match=LINE: a line of hers (SYSOP.INI), when it is said
;            ghost      match=GHOST (a ghost's page, GHOSTS.INI) or WHO_GHOST (the ghost is in WHO)
;            diag       match=CODE: the answer of the diagnostics door (HELP for its help)
;            shell      match=/PATH: a file read with cat in the NOWHERE shell
;            login      no match: shown on the first sign-in of an own account (the front page)
;   src=     where it came from (30 characters at most)
;   text=    the line kept (110 characters at most)
;   where=   for a file: the area and name, to read it again. A message is looked up by the board.
;   has= lacks=  flags the caller needs, or must not have, for the note to be taken
;   replay=  scene:NAME, page:RULE, eliza:LINE, ghost:ID or art:NAME (a picture of the story):
;            R in the notebook shows it again as it was; a replay saves nothing
;   clue=    the ids in docs/PUZZLE_CHAIN.md (M1 to M9, P1 to P12) and the story bible (E01 to E48)
;            this note covers. Only the story lint reads it (check_notes).
;
; All caller-visible wording is a DRAFT. The author makes the final edit.

