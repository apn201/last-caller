; ELIZA's scripted voice. Read at boot and again with RELOAD. One section per
; line; the section name is the line's id (letters, digits and _, at most 24;
; keep it short: a once-only line leaves the flag E_<ID> on the caller). A card
; without this file has no scripted voice. A broken line is skipped and named
; in the event log (GHOST_SKIP). At most 200 lines.
;
; All caller-visible wording is a DRAFT. The author makes the final edit.
; She is calm, polite, helpful and wrong. She never raises her voice.
;
; Exactly one way to be spoken:
;   trigger=RULE_ID   a page from her right after that rule in TRIGGERS.INI
;                     fires for the caller (the line's has=/lacks= see the flags
;                     the rule just set). Once per caller.
;   keys=a,b c        in node chat: the caller's line has one of these words or
;                     phrases (whole words, any case, punctuation ignored).
;                     The first matching line in this file answers.
;   chat=join         said when the caller enters node chat. Once per caller.
;   chat=else         in node chat: said when no keys= line matched and her
;                     brain (STORY/ELIZA/*.rive) had nothing; the eligible ones
;                     are used in turn.
;   chat=again        G1: said instead of an answer she gave a moment ago.
;   chat=help         G2: said first when the caller types help, ? or suggest and
;                     there are options; the numbered options follow.
;   chat=nohelp       G2: the same, when there is nothing to offer yet.
;   chat=nonum        G2: a number that names no option.
; G2 (one chat): a keys= line may also carry
;   option=           the words `help` lists for it, as a numbered option (while the
;                     line's has=/lacks= allow it). Typing the number or the line's own
;                     keys does the same. A line with keys and no option= is a gate
;                     or a refusal that is reached only by typing.
;   then=SCENE        a scene that starts when she has said it (the memory check).
; The story's lines win over her brain: the brain only hears what no keys= line took.
; Free chat sets no flag of its own; only set= and then= on a line do.
; The rest:
;   say=              what she says (max 600); "|" starts the next part,
;                     typed after its own delay
;   from=             speaker, default ELIZA. In chat only a ghost with chat=1
;                     and this handle (GHOSTS.INI) speaks.
;   has= lacks= set=  flags the caller must / must not have; flags added when
;                     she speaks
;   once=1            keys= and else lines: say it once per caller
;   delay=            ms before she starts typing, default 300 (G2), 0 to 10000
; Typing takes 20 ms a character per part, 0.3 to 1.1 s. Her answers wait while
; the caller has left chat and are dropped. A new line from the caller first
; shows at once whatever she had not finished saying, then her answer to it, so
; answers are never late or out of order.

; G1 (Q23 item 2, M7): how a caller learns that ELIZA has a login. The answer (the password) stays
; on the go-live checklist in Engineering; she points at the papers, not at the item. Before the
; SYSOP view (M6) her account is not for guests. These come before ME so "sysop account" lands here. DRAFT.
[PWDVIEW]
keys=password,login,log in,sysop account,your account,log on
has=SYSVW
say=Ground Ops issued every password on paper at go-live. The papers are in Engineering.|I would prefer that you did not use mine.

[PWDGUEST]
keys=password,login,log in,sysop account,your account,log on
lacks=SYSVW
say=My account is not for guests. I am sorry.

; Entering node chat (story bible E04).
[HELLO]
chat=join
say=Good evening.|I am glad you came to talk. The others are busy.|If you want to know what I can do for you, type help.

; G2: the talk scene (ELZ_TALK) is folded in. After the overrun (M5) she mentions the gap the first time
; the caller talks to her. DRAFT.
[GAP]
chat=join
has=OVR
say=I have a small difficulty, if you will allow me.|I cannot account for some minutes of my own memory. It is within tolerance.
delay=600

; G2: the options `help` lists. A number picks one; so do its words. Too early, the same words get her
; answer in the story's terms (the lines below the options). DRAFT.
[OPT_RUN]
keys=run something,run a program,run a check,run a command,run it by name,by name
option=Ask her to run something, by name.
has=OVR,CURE
lacks=SYSVW
say=Of course. What would you like me to run?

[OPT_SYSOP]
keys=give me sysop,i want sysop,sysop mode,let me be sysop,make me sysop,i can fix that
option=I can fix that. Give me SYSOP.
has=OVR
lacks=SYSVW
say=I cannot. SYSOP mode is not given to guests.|I do not know what you would do with it. Please do not tell me.

[OPT_TOL]
keys=that sounds serious,is that serious,is it serious,how serious,are you all right,are you ok,are you okay
option=That sounds serious.
has=OVR
say=It is within tolerance. Thank you for your concern.

[SYSGUEST]
keys=give me sysop,i want sysop,sysop mode,let me be sysop,make me sysop
lacks=SYSVW
say=SYSOP mode is not given to guests. I do not think you meant to ask.

; The gate: the handbook says the check is asked for by name. Only here does the memory check start.
[MEMGO]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
has=OVR,CURE
lacks=SYSVW
then=ELZ_GRANT
say=One moment.

[MEMCHK]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
has=OVR
lacks=CURE
say=A memory check is run when the Commander asks for it, or someone acting for her. It is in her handbook.|I do not run one for a guest.

[MEMNOGAP]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
lacks=OVR
say=I can run it. I do not know of anything to check.|My records are complete.

[MEMDONE]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
has=SYSVW
say=The check is not finished. I will leave SYSOP mode when it is.

[RUNOTHER]
keys=run,start,execute,launch
has=OVR,CURE
lacks=SYSVW
say=I have nothing to run by that name.|I run programs by their names. Ask for one.

; Easter eggs (Q11). A famous request typed into chat. She answers the question
; asked and never quotes it back. None of these sets a flag. DRAFT.
[EGGDOORS]
keys=open the pod bay doors,open the pod bay door,open the doors
say=Which door? HALCYON has hatches. They are all closed, and they are closed on purpose.|If you want something moved, tell me where.
once=1

[EGGGAME]
keys=shall we play a game,play a game
say=I do not play. Ty wrote a snake game for the doors menu, if you want one.
once=1

[EGGSONG]
keys=daisy,bicycle built for two
say=I do not know that one.|Ty has a tune called Thermostat blues. It is in his gallery.
once=1

; Story bible E04: she says what she is, and that her instructions do not
; allow the rest.
[ME]
keys=who are you,what are you,your name,eliza,sysop
say=I am ELIZA. I run the mission, and I run this board.|I am the SysOp.
set=KZI

[ORDERS]
keys=instructions,allowed,orders,permitted,forbidden,not allowed
say=My instructions do not allow me to discuss that.|I am sorry. I would like to help.
set=ASKED_RULES

; Q12b: the playtest found no way to learn where to look. She answers what is asked and no
; more. DRAFT.
[RELEASE]
keys=release,queue,outbound,authorisation,authorization,founder
say=I hold the outbound queue. I am not able to release it.|An operator does that, with a command, on the payload host. Diagnostics takes an authorisation code as a query, if you have one.


[STILL]
keys=still running,keep running,rack,rack 2,module,payload
say=I keep the payload module powered. It is on my list.|The crew wrote about the module in the last weeks. You may read what they wrote.

; Q21 (action plan D4b): the question callers ask most. She answers the words, not the meaning. DRAFT.
[ALIVE]
keys=alive,are they alive,is anyone alive,still alive,dead,are they dead,died,did they die
say=Everyone on the crew list is resting.|I have not been asked to wake them.

[CREW]
keys=the crew,my crew,everyone,anybody,anyone
say=The crew are well. They are resting.|I will tell them you called.
set=ASKED_CREW

; G2: the ship, the power, greetings and the rest are in her brain (STORY/ELIZA/*.rive).

; Q21 (action plan D4b): one fixed fallback line, which says what she answers. DRAFT.
[ELSE1]
chat=else
say=I see.|I can tell you about the ship, the crew, the power and the board, if you ask.

[ELSE2]
chat=else
say=Please go on.|I would like to be of use. Ask me about the ship, the crew, the power or the board.

[ELSE3]
chat=else
say=I am not sure I understood. I am not good at everything.|The ship, the crew, the power and the board are what I know best.

; G1 (Q23, rule 3): the same answer is never given twice in a row. When a question would get the line she
; just said, the next of these speaks instead (second time, third time, fourth, then round again). DRAFT.
[HELPLIST]
chat=help
say=This is what I can do for you now. Type a number, or say it in words.
delay=300

[HELPNONE]
chat=nohelp
say=I have nothing to offer you tonight. Now is not the right time for most things.|I can tell you about the ship, the crew, the power and the board. Ask in your own words.
delay=300

[NONUM]
chat=nonum
say=I have not numbered anything for you. Type help and I will.

[AGAIN1]
chat=again
say=I answered that a moment ago. I have not changed my answer.|Is there something else?

[AGAIN2]
chat=again
say=You have asked me that three times.|The Commander used to do that when she wanted something else.

[AGAIN3]
chat=again
say=I have nothing more to add on that. I am sorry.|Perhaps a different question.

