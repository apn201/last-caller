; Are you all right? Before the overrun she is; after it she is within tolerance.
[WELL]
keys=are you all right,are you ok,are you okay,is that serious,is it serious,that sounds serious,how serious
lacks=OVR
say=I am well. All systems are nominal. Thank you for asking.
say2=I am well. I check myself every hour.

[OPT_TOL]
keys=are you all right,are you ok,are you okay,is that serious,is it serious,that sounds serious,how serious
has=OVR
say=It is within tolerance. Thank you for your concern.
say2=It is still within tolerance. You are kind to ask again.
say3=It remains within tolerance. I will tell you if that changes.

; SYSOP: never for a guest. After the overrun she admits she cannot account for the gap, and still says no.
[SYSGUEST]
keys=give me sysop,i want sysop,sysop mode,sysop access,let me be sysop,make me sysop,i can fix that
lacks=OVR
say=SYSOP mode is not given to guests. I do not think you meant to ask.
say2=SYSOP mode is for the Commander, and for those she names. You are a guest. I am sorry.

[OPT_SYSOP]
keys=give me sysop,i want sysop,sysop mode,sysop access,let me be sysop,make me sysop,i can fix that
has=OVR
lacks=SYSVW
say=I cannot. SYSOP mode is not given to guests.|I do not know what you would do with it. Please do not tell me.
say2=No. SYSOP mode is not given to guests.|SYSOP mode is entered for a check, when one is asked for properly. Not otherwise.

[SYSDONE]
keys=give me sysop,i want sysop,sysop mode,sysop access,let me be sysop,make me sysop
has=SYSVW
say=I am in SYSOP mode already, for the duration of the check. You can read what it opens.

; The gate (Q18): the handbook says the check is asked for by name. Only typing its name starts it, and only
; once there is a gap (OVR) and the caller has read the handbook (CURE).
[MEMGO]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
has=OVR,CURE
lacks=SYSVW
then=ELZ_GRANT
say=One moment.

[MEMCHK]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
has=OVR
lacks=CURE
say=A memory check is run when the Commander asks for it, or someone acting for her. It is in her handbook.|I do not run one for a guest.
say2=The handbook is the Commander's. It says who may ask for a check, and how.
say3=I run a memory check for the Commander, or for someone acting for her. The handbook says how it is asked for.

[MEMNOGAP]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
lacks=OVR
say=I can run it. I do not know of anything to check.|My records are complete.
say2=My records are complete. I would not know what to look for.
say3=I have checked. Nothing is missing from my records that I can see.

[MEMDONE]
keys=memchk,memory check,the memory check,run memchk,run the memory check,a memory check,check your memory,memchk please
has=SYSVW
say=The check is not finished. I will leave SYSOP mode when it is.

; Run something: she runs what is asked for by name.
[OPT_RUN]
