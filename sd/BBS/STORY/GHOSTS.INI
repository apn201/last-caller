; Ghosts: callers who are listed in WHO and in node chat but are not on a
; node. Read at boot and again with RELOAD. One section per ghost; the section
; name is the ghost's id (letters, digits and _, at most 24; keep it short: the
; page marker G_<ID> is a flag on the caller). A card without this file has no
; ghosts. A broken ghost is skipped and named in the event log (GHOST_SKIP);
; the others still load. At most 24 ghosts.
;
; All caller-visible wording is a DRAFT. The author makes the final edit.
;
;   handle=      name in WHO (max 16)                                   needed
;   node=        node number shown, 0 to 99; a ghost is never listed on a
;                node a real caller is on; two ghosts cannot share one  needed
;   activity=    what the ghost is doing (max 24); it may stop mid-line
;   idle=        idle time as text (max 10), e.g. 28y; empty shows 0:00
;   has= lacks=  flags the caller must / must not have
;   online_min=  minutes the caller has been connected
;   powered=1    only while the ship has power
;   chat=1       named in node chat (the Here list, /W). ELIZA's lines in
;                SYSOP.INI are spoken only by a ghost with chat=1.
;   page_after=  seconds after sign-in; page_from= (default the handle) and
;   page=        the line the ghost sends to this caller, once, at the next
;                calm menu prompt. "|" breaks a line. set= flags are added
;                with the page.
; Ghosts are not sessions: they take no node from the pool, cannot be
; disconnected and are never in the chat log.

; The SysOp. Pages every new caller inside half a minute (slice S6) and is
; in node chat (story bible E04).
[ELIZA]
handle=ELIZA
node=0
activity=SYSOP
idle=0:00
chat=1
page_after=15
page_from=ELIZA
page=Good evening. I am the SysOp.|If you need anything, type C and I will be there.

