; The ship systems console. One section per command: the section name is the
; command, "aliases" are other ways to type it (comma separated), "text" is the
; answer ("|" breaks a line), "text_powered" replaces it once the RTG is on the
; bus, "help" is the line HELP shows (no help= = not listed), "effect" is
; HELP, EXIT, RTG (the power-source switch) or ACCOUNT (make a crew account;
; listed and allowed only after the RTG). The [SHIP] section holds the
; console's own lines.
; All caller-visible wording is a DRAFT. The author makes the final edit.

[SHIP]
title=HALCYON SHIP SYSTEMS
prompt=SHIP>
help_title=COMMANDS
unknown=UNKNOWN COMMAND - TYPE HELP
aborted=SWITCH ABORTED. NO CHANGE.
rtg_online=RTG ONLINE|BUS STABLE|ATTITUDE HOLD
wake_line=Good evening. I have been asleep for some time.
make_account=CREW REGISTRATION ENABLED|TYPE CREW TO REGISTER

[STATUS]
aliases=ST
help=Ship status
text=HALCYON SHIP STATUS|BUS          SOLAR DIRECT - UNSTABLE|ATTITUDE     TUMBLING|PAYLOAD      POWERED, LOW DRAW|COMMS        DOWNLINK DISABLED|MISSION AI   NOT RESPONDING
text_powered=HALCYON SHIP STATUS|BUS          RTG - STABLE|ATTITUDE     HOLD|PAYLOAD      POWERED|COMMS        DOWNLINK DISABLED|MISSION AI   ONLINE

[POWER]
aliases=BUS,POWER BUS
help=Power bus
text=POWER BUS|SOURCE       SOLAR DIRECT|RTG          DISCONNECTED - MANUAL|BATTERY BANK OPEN CIRCUIT|SOLAR INPUT  PARTIAL - TUMBLING|TO CHANGE SOURCE: SOURCE RTG
text_powered=POWER BUS|SOURCE       RTG|RTG          CONNECTED|BATTERY BANK OPEN CIRCUIT|SOLAR INPUT  PARTIAL - TUMBLING|BUS          STABLE

[ATTITUDE]
aliases=ATT
help=Attitude control
text=ATTITUDE|CONTROL      OFFLINE - NO BUS POWER|RATE         TUMBLING|CHANGES NOT PERMITTED
text_powered=ATTITUDE|CONTROL      HOLD|RATE         NEGLIGIBLE|CHANGES NOT PERMITTED

[PAYLOAD]
aliases=PAY
help=Payload status
text=PAYLOAD|MODULE       POWERED, LOW DRAW|COOLING      ON|CHANGES NOT PERMITTED
text_powered=PAYLOAD|MODULE       POWERED|COOLING      ON|CHANGES NOT PERMITTED

[COMMS]
help=Communications
text=COMMS|DOWNLINK     DISABLED|UPLINK       NO CARRIER FROM EARTH|CHANGES NOT PERMITTED
text_powered=COMMS|DOWNLINK     DISABLED|UPLINK       NO CARRIER FROM EARTH|CHANGES NOT PERMITTED

[SOURCE]
text=USAGE: SOURCE RTG

[SOURCE RTG]
aliases=RTG,CONNECT RTG,RTG ON,SOURCE=RTG
