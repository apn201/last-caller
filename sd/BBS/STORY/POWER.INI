; Ship power: the prologue every new caller plays, and the maintenance login.
; Read at boot and again with RELOAD. A card without this file has no prologue:
; callers log in or sign up as usual.
; Power is per caller. Every connection starts in brownout. The front page is
; the boot banner and a login prompt (no "New"). Registered callers log in and
; go straight to the board. A caller with no account logs in as the
; maintenance account, switches the ship to the RTG in the console, and makes
; a crew account there. Nothing here depends on anyone else's session.
; All caller-visible wording is a DRAFT. The author makes the final edit.

[POWER]
; Seconds the maintenance login has to switch to the RTG. When it runs out the
; session ends with the power-glitch screen. Switching to the RTG stops it.
timer_sec=120
; The ship's maintenance account. The board creates it on first boot,
; read-only, and it is not the SysOp. Many sessions may use it at once.
maint_account=admin
maint_password=admin
; The key the RTG warning asks the caller to type.
confirm_key=K

[TEXT]
; One line under "Unknown caller." at the login prompt. DRAFT.
unknown_hint=No such account on this bus. The maintenance login is on the service label.
