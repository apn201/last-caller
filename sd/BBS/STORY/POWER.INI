; Ship power: brownout, the maintenance login and how long power holds.
; Read at boot and again with RELOAD. The power state itself is kept by the
; board in DATA/STATE/POWER.DAT. A card without this file has no prologue: the
; board is simply powered.
; All caller-visible wording is a DRAFT. The author makes the final edit.

[POWER]
; Brownout: every session ends after a random time in this window (seconds).
window_min=60
window_max=120
; Powered: minutes after the last caller leaves before the board falls back
; to brownout. 0 = never falls back (the first caller's power-up is permanent).
; For a test, set 1.
decay_after_idle_min=15
; The ship's maintenance account. The board creates it on first boot,
; read-only, and it is not the SysOp.
maint_account=admin
maint_password=admin
; The key the RTG warning asks the caller to type.
confirm_key=K
; State when the board has no POWER.DAT yet: brownout or powered.
start=brownout
